services:
  postgres:
    image: postgres:16-alpine
    container_name: pairledger-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pairledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pairledger}
      POSTGRES_DB: ${POSTGRES_DB:-pairledger}
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pairledger-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pairledger.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

volumes:
  pgdata:
