spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:pairledger}
    username: ${POSTGRES_USER:pairledger}
    password: ${POSTGRES_PASSWORD:pairledger}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-that-is-at-least-256-bits-long-for-hmac-sha}
    expiration-ms: 86400000  # 24 hours

server:
  port: 8080
